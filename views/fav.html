<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <title>รายการที่ถูกใจ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <script src="/js/theme.js"></script>
  <script src="/js/navbar-account.js"></script>
  <script src="/js/back-button.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/account-sync.js"></script>
  <style>
    /* ให้พื้นหลัง dark mode เหมือนหน้า Home เป๊ะๆ */
    body, html {
      font-family: "Kanit", sans-serif !important;
      transition: background 0.3s, color 0.3s;
    }
    body:not(.dark), html:not(.dark) body {
      background: #fafafa !important;
    }
    body.dark, html.dark body {
      background: #1e1e1e !important;
      color: #e0e0e0 !important;
    }

    /* สำรอง: บังคับข้อความ h1 เป็นสีขาวใน dark mode */
    body.dark h1 {
      color: white !important;
    }

    body.dark input {
      color: #000;
    }
  </style>
</head>

<body class="bg-[#fdf6f9] text-black transition-colors duration-300">

  <div id="navbar-container"></div>

  <div class="container max-w-5xl mx-auto p-6">
    <h1 class="text-3xl font-bold text-center mb-6 text-black dark:text-white">รายการที่ถูกใจ</h1>
    <div id="fav-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
  </div>

  <script>
    const currentPage = window.location.pathname;

    // โหลด Navbar
    fetch("/navbar-main")
      .then(res => res.text())
      .then(data => {
        document.getElementById("navbar-container").innerHTML = data;

        // Active menu
        const menuLinks = document.querySelectorAll(".menu a");
        menuLinks.forEach(link => {
          if (link.getAttribute("href") === currentPage) link.classList.add("active");
          else link.classList.remove("active");
        });

        // Profile dropdown + ออกจากระบบ (รวมศูนย์ไว้ที่ navbar-account.js ให้ทำงานเหมือนกันทุกหน้า)
        if (window.initNavbarAccount) window.initNavbarAccount();
        if (window.initBackButton) window.initBackButton('/home');

        // Dark Mode (ใช้ theme.js ที่ใช้ร่วมกันทุกหน้า เพื่อ sync ไอคอนให้ตรง)
        if (window.applyTheme) window.applyTheme(localStorage.getItem("theme") || "light");

        // โหลด search.js หลังจาก navbar โหลดเสร็จ
        const script = document.createElement("script");
        script.type = "module";
        script.src = "js/search.js";
        document.body.appendChild(script);

        // โหลด chatbot.js
          const s = document.createElement("script");
          s.src = "/js/chatbot.js";
          s.defer = true;
          s.onload = () => {
            if (window.bootChatbot) window.bootChatbot();
          };
          document.body.appendChild(s);
      });

    // โหลดรายการถูกใจ
    function loadFavorites() {
      const favList = document.getElementById("fav-list");
      favList.innerHTML = "";
      let favs = JSON.parse(localStorage.getItem("favorites")) || [];

      if (favs.length === 0) {
        favList.innerHTML = `<p class="text-center text-gray-500 dark:text-gray-300 col-span-full">ยังไม่มีรายการถูกใจ</p>`;
        return;
      }

      favs.forEach(novel => {
        const card = document.createElement("div");
        card.className = "bg-white dark:bg-gray-800 rounded-xl shadow hover:shadow-lg overflow-hidden transition";
        card.innerHTML = `
          <img src="${novel.Image}" alt="${novel.title}" class="w-full h-56 object-cover">
          <div class="p-4 text-center">
            <div class="text-lg font-bold text-black dark:text-white">${novel.title}</div>
            <div class="text-sm text-gray-500 dark:text-gray-300">${novel.author}</div>
            <button class="remove-btn mt-3 bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">ลบออก</button>
          </div>
        `;

        // ปุ่มลบ
        card.querySelector(".remove-btn").addEventListener("click", () => {
          favs = favs.filter(item => item.id !== novel.id);
          localStorage.setItem("favorites", JSON.stringify(favs));
          if (window.AccountSync) window.AccountSync.syncFavoriteRemove(novel.id);
          loadFavorites();
        });

        // คลิกไปหน้า detail
        card.addEventListener("click", (e) => {
          if (!e.target.classList.contains("remove-btn")) {
            window.location.href = `/detail?id=${novel.id}`;
          }
        });

        favList.appendChild(card);
      });
    }

    loadFavorites();
  </script>
</body>

</html>
