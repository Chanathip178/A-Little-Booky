<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <title>Navbar Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Kanit", sans-serif;
      background: #fdf7f6;
      transition: background 0.3s, color 0.3s;
    }

    body.dark {
      background: #1e1e1e;
      color: #e0e0e0;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #fff;
      padding: 10px 20px;
      border-bottom: 1px solid #ddd;
      font-size: 16px;
      transition: background 0.3s, color 0.3s;
    }

    body.dark .navbar {
      background-color: #2a2a2a;
      border-bottom: 1px solid #444;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img {
      height: 55px;
      border-radius: 8px;
    }

    .logo span {
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }

    body.dark .logo span {
      color: #e0e0e0;
    }

    .menu {
      display: flex;
      gap: 100px;
      margin-left: 40px;
    }

    .menu a {
      text-decoration: none;
      color: #333;
      font-size: 18px;
      transition: 0.2s;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
    }

    .menu a.active {
      color: #d633f9;
      font-weight: bold;
      border-bottom: 2px solid #d633f9;
    }

    .menu a:hover {
      color: #d633f9;
    }

    body.dark .menu a {
      color: #e0e0e0;
    }

    body.dark .menu a.active {
      color: #d633f9;
    }

    .right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .icon-btn {
      background: #f4f4f4 !important;
      border: none !important;
      padding: 8px 12px !important;
      border-radius: 8px !important;
      cursor: pointer;
      font-size: 18px !important;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      color: #333 !important;
    }

    .icon-btn:hover {
      background: #ddd;
    }

    body.dark .icon-btn {
      background: #444 !important;
      color: #e0e0e0 !important;
    }

    body.dark .icon-btn:hover {
      background: #666;
    }

    .autocomplete {
      position: relative;
      width: 300px;
    }

    #search {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #ddd;
      border-top: none;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      max-height: 250px;
      overflow-y: auto;
      z-index: 20;
    }

    .suggestion-item {
      padding: 10px 12px;
      cursor: pointer;
    }

    .suggestion-item:hover {
      background: #f5f4ff;
    }

    /* Dark mode styles for input text */
    body.dark .search-box input {
      color: #000;
      /* ทำให้ข้อความใน input เป็นสีดำ */
      background: #e0e0e0;
      /* เปลี่ยนพื้นหลังให้สว่างขึ้นเพื่อให้เห็นข้อความ */
    }

    body.dark .suggestions {
      background: #2a2a2a;
      border: 1px solid #444;
    }

    body.dark .suggestion-item {
      color: #e0e0e0;
    }

    body.dark .suggestion-item:hover {
      background: #444;
    }

    .profile {
      width: 36px;
      height: 36px;
      background: #6c6573;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .dropdown {
      position: absolute;
      top: 60px;
      right: 20px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      display: none;
      flex-direction: column;
      min-width: 160px;
      z-index: 1000;
    }

    body.dark .dropdown {
      background: #2a2a2a;
      border: 1px solid #444;
    }

    .dropdown.show {
      display: flex;
    }

    .dropdown a {
      padding: 10px 15px;
      text-decoration: none;
      color: #333;
      transition: 0.2s;
    }

    .dropdown a:hover {
      background: #f4f4f4;
      color: #d633f9;
    }

    body.dark .dropdown a {
      color: #e0e0e0;
    }

    body.dark .dropdown a:hover {
      background: #444;
    }

    .profile-menu {
      position: relative;
    }

    /* ปุ่ม Dark/Light */
    .darkmode-btn {
      cursor: pointer;
      font-size: 18px !important;
      background: #f4f4f4 !important;
      padding: 8px 12px !important;
      border-radius: 8px !important;
      border: none !important;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      color: #333 !important;
    }

    body.dark .darkmode-btn {
      background: #444 !important;
      color: #e0e0e0 !important;
    }

    /* ปุ่ม chatbot แบบกลม */
    #chatbot-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background: #6b46c1;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      z-index: 10000;
      transition: background 0.3s;
      overflow: hidden;
    }

    #chatbot-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      /* 👈 บังคับให้รูปไม่บิดและอยู่ในวงกลม */
      border-radius: 50%;
      /* เผื่อรูปเป็นสี่เหลี่ยมจะโค้งตามปุ่ม */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #chatbot-btn:hover {
      background: #5530a0;
    }

    /* ===== Responsive: กันไม่ให้ navbar ล้นจอแนวนอนบนหน้าจอแคบ ===== */
    .navbar {
      flex-wrap: wrap;
      row-gap: 10px;
    }

    .autocomplete {
      width: min(300px, 40vw);
      min-width: 140px;
    }

    @media (max-width: 1024px) {
      .menu {
        gap: 24px;
        margin-left: 20px;
      }
    }

    @media (max-width: 700px) {
      .navbar {
        justify-content: center;
      }

      .logo {
        flex: 1 1 auto;
      }

      .menu {
        order: 3;
        width: 100%;
        justify-content: center;
        gap: 20px;
        margin-left: 0;
      }

      .right {
        flex: 0 0 auto;
      }

      .autocomplete {
        width: 140px;
        min-width: 100px;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="logo">
      <img src="/img/logo.png" alt="โลโก้" />
      <span>A little booky</span>
    </div>

    <div class="menu">
      <a href="/home">Home</a>
      <a href="/reading">Reading</a>
      <a href="/writing">Writing</a>
    </div>

    <div class="right">
      <!-- ปุ่ม toggle theme -->
      <button id="darkmode-toggle" class="darkmode-btn">
        <i class="fa-regular fa-moon"></i>
      </button>

      <a href="/fav" class="icon-btn"><i class="fa-regular fa-heart"></i></a>
      <a href="/cart" class="icon-btn"><i class="fa-solid fa-cart-shopping"></i></a>

      <div class="autocomplete">
        <input id="search" type="search" placeholder="ค้นหานิยาย..." aria-label="Search novels" />
        <div id="suggestions" class="suggestions" hidden></div>
      </div>

      <div class="profile-menu">
        <div class="profile"><i class="fa-regular fa-user"></i></div>
        <div class="dropdown">
          <a href="/logout">ออกจากระบบ</a>
        </div>
      </div>
    </div>
  </nav>
  <!-- Chatbot widget -->
  <div id="chatbot-root" style="position: fixed; right: 16px; bottom: 100px; z-index: 9999">
    <div id="chatbot-window" style="
          width: 320px;
          max-height: 60vh;
          display: none;
          background: #fff;
          border: 1px solid #ddd;
          border-radius: 10px;
          box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
          overflow: hidden;
        ">
      <div style="
            padding: 10px 12px;
            background: #6b46c1;
            color: #fff;
            font-weight: 600;
          ">
        แชทช่วยเหลือ
      </div>
      <div id="chatbot-messages" style="
            padding: 12px;
            height: 280px;
            overflow: auto;
            font-family: system-ui, sans-serif;
            font-size: 14px;
          "></div>
      <div id="chatbot-actions" style="padding: 12px; border-top: 1px solid #eee"></div>
    </div>
    <!-- ปุ่ม chatbot แบบกลม -->
    <button id="chatbot-btn">
      <img src="/img/chatbot.jpg" alt="Chat" />
    </button>
  </div>

  <!-- Load the chatbot logic -->
  <script src="js/chatbot.js"></script>

  <script type="module" src="js/search.js"></script>
</body>

</html>
